<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside Addictive Design</title>
<meta name="description" content="Interactive research dashboard of findings from internal corporate documents on habit-forming and addictive digital product design.">
<style>
:root{
  --bg:#ffffff; --bg2:#f7f8fa; --surface:#ffffff; --surface2:#f3f5f8; --surface3:#eef1f5;
  --border:#e1e5eb; --border2:#cdd4de; --text:#121821; --text2:#3d4a5a; --muted:#637083; --faint:#9aa4b1;
  --accent:#0a6fa8; --accent-dim:rgba(10,111,168,.12);
  --high:#a86200; --moderate:#4f6480; --low:#7a8696;
  --ev-knowledge:#2f6fd6; --ev-investigation:#7048c8; --ev-design:#c2551f; --ev-outcome:#0f8a78; --ev-contrary:#3f8a1f; --ev-context:#5f6b7c;
  --synth:#7c5cc4; --csv:#5a6f86; --verbatim:#121821;
  --radius:10px; --radius-sm:6px;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Charter", "Palatino Linotype", Georgia, serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:clip}
html{color-scheme:light}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* Sidebar */
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px}
.brand .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand .name{font-weight:650;font-size:15px;line-height:1.3;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:var(--radius-sm);color:var(--text2);font-size:14px;text-decoration:none}
.nav a:hover{background:var(--surface);color:var(--text)}
.nav a.active{background:var(--accent-dim);color:var(--accent)}
.nav a .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.nav a.active .n{color:var(--accent)}
.side-block{border-top:1px solid var(--border);padding:14px 8px 0;font-size:12.5px;color:var(--muted)}
.side-block h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side-block .btn{width:100%;justify-content:center;margin-top:6px}
.data-status{font-size:12px;color:var(--text2);line-height:1.5}
.data-status code{font-family:var(--mono);font-size:11.5px;color:var(--text)}
/* Main */
main{background:var(--bg);min-width:0;padding:28px clamp(16px,3vw,40px) 80px}
.section{display:none;max-width:1320px;margin:0 auto}
.section.active{display:block}
.sec-head{margin-bottom:22px}
.sec-head .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.sec-head h2{margin:6px 0 6px;font-size:26px;line-height:1.2;font-weight:650;letter-spacing:-.01em}
.sec-head p{margin:0;color:var(--text2);max-width:880px}
h3{font-size:17px;margin:0 0 10px;font-weight:620}
h4{font-size:14px;margin:0 0 8px;font-weight:620}
.muted{color:var(--muted)} .small{font-size:12.5px} .mono{font-family:var(--mono)}
.grid{display:grid;gap:14px}
.grid > *{min-width:0}
code{word-break:break-word;overflow-wrap:anywhere}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{box-shadow:0 1px 2px rgba(16,24,40,.04);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.panel + .panel{margin-top:14px}
.block{margin-top:30px}
.block > h3{display:flex;align-items:center;gap:10px}
/* Hero */
.hero{padding:6px 0 8px}
.hero .kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(26px,3.4vw,38px);line-height:1.12;margin:10px 0 10px;letter-spacing:-.02em;font-weight:680;max-width:980px}
.hero .sub{font-size:17px;color:var(--text2);margin:0 0 14px;max-width:900px}
.hero .intro{max-width:900px;color:var(--text2)}
.legend-prov{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.legend-prov .item{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:12.5px;color:var(--text2);max-width:360px}
/* Provenance tags */
.prov{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:650;padding:2px 6px;border-radius:4px;white-space:nowrap;vertical-align:middle}
.prov.verbatim{background:#121821;color:#ffffff}
.prov.csv{border:1px solid var(--csv);color:var(--csv)}
.prov.synth{border:1px dashed var(--synth);color:var(--synth)}
.synth-box{border:1px dashed rgba(124,92,196,.45);background:rgba(124,92,196,.04);border-radius:var(--radius);padding:14px 16px}
.synth-box > .prov{margin-bottom:8px}
/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:22px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 12px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.metric:hover{border-color:var(--border2);background:var(--surface2)}
.metric .lab{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.metric .val{font-size:28px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15}
.metric .val.sm{font-size:16px;line-height:1.35;margin-top:8px}
.metric .sub{font-size:12px;color:var(--text2);margin-top:4px}
.metric .bar{height:3px;border-radius:2px;margin-top:10px;background:var(--border)}
/* Badges & chips */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--border2);color:var(--text2);white-space:nowrap;background:var(--surface2)}
.badge .dot{width:7px;height:7px;border-radius:50%}
.rel{font-weight:650;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:4px;white-space:nowrap}
.rel.High{background:rgba(214,150,20,.16);color:var(--high);border:1px solid rgba(214,150,20,.45)}
.rel.Moderate{background:rgba(79,100,128,.12);color:var(--moderate);border:1px solid rgba(79,100,128,.4)}
.rel.Low{background:rgba(100,112,128,.14);color:#5f6b7c;border:1px solid rgba(100,112,128,.45)}
.ev{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:4px;border:1px solid;white-space:nowrap;background:transparent;cursor:pointer}
.ev small{opacity:.8;font-size:10.5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface3);color:var(--text2);border:1px solid transparent;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--border2);color:var(--text)}
.idchip{font-family:var(--mono);font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--surface3);color:var(--accent);border:1px solid var(--border);cursor:pointer}
.idchip:hover{border-color:var(--accent)}
.idchip.missing{color:var(--faint);cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.auto-flag{font-size:10.5px;color:#a86200;border:1px solid rgba(214,150,20,.5);padding:1px 6px;border-radius:4px}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);cursor:pointer;font-size:13px;color:var(--text);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#ffffff;font-weight:650}
.btn.primary:hover{background:#085a89}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.view-orig{background:var(--accent);color:#ffffff;border:1px solid var(--accent);font-weight:650}
.view-orig:hover{background:#085a89;text-decoration:none}
/* Toolbar / filters */
.toolbar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px;position:sticky;top:0;z-index:5}
.toolbar .row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:130px;flex:1 1 140px}
.field.wide{flex:3 1 280px}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
input[type=search],select{background:var(--bg2);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:7px 9px;font-size:13.5px;width:100%;font-family:inherit}
input[type=search]:focus,select:focus{border-color:var(--accent);outline:none}
.result-line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--text2)}
.active-filters{display:flex;flex-wrap:wrap;gap:6px}
.af{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(10,111,168,.35);cursor:pointer}
.groupchips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--border2);background:var(--bg2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--text2)}
.gchip .dot{width:8px;height:8px;border-radius:50%}
.gchip.on{color:var(--text);background:var(--surface3)}
.gchip .cnt{font-family:var(--mono);font-size:11px;color:var(--muted)}
/* Document cards */
.doc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.doc-card.open{border-color:var(--border2)}
.doc-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px 16px;cursor:pointer}
.doc-head:hover{background:var(--surface2)}
.doc-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.doc-title .fn{font-family:var(--mono);font-size:14.5px;font-weight:600;color:var(--text)}
.doc-title .rid{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.doc-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--text2);margin-top:6px}
.doc-meta span b{color:var(--muted);font-weight:500}
.doc-summary{margin-top:8px;font-size:13.5px;color:var(--text2)}
.doc-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.caret{font-size:12px;color:var(--muted)}
.doc-body{border-top:1px solid var(--border);padding:16px;background:var(--bg2)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--text2)}
/* Finding cards */
.f-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.f-card.in-doc{background:var(--surface)}
.f-top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.f-top .fid{font-family:var(--mono);font-size:12px;color:var(--accent);cursor:pointer}
.cat{font-size:12px;color:var(--text2)}
.quote{margin:12px 0 10px;padding:4px 0 4px 14px;border-left:3px solid var(--text2);font-family:var(--serif);font-size:16.5px;line-height:1.5;color:var(--verbatim);cursor:pointer;white-space:pre-wrap}
.quote:hover{border-left-color:var(--accent)}
.f-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--text2)}
.f-meta .docname{font-family:var(--mono);color:var(--text);cursor:pointer}
.f-meta .docname:hover{color:var(--accent)}
.loc{font-size:12.5px;color:var(--text2);margin-top:6px}
.loc b{color:var(--muted);font-weight:500}
.ann{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.ann > div{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font-size:13px;color:var(--text2)}
.ann .lim{border-color:rgba(214,150,20,.28);background:rgba(214,150,20,.035)}
.ann h5{margin:0 0 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ann .lim h5{color:#8f6100}
.f-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-top:10px}
.f-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px}
.f-actions{display:flex;gap:6px;flex-wrap:wrap}
/* Charts */
.chart{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;cursor:pointer;padding:2px 4px;border-radius:4px}
.hb:hover{background:var(--surface2)}
.hb .l{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{height:14px;background:var(--bg2);border-radius:3px;position:relative;overflow:hidden}
.hb .fill{height:100%;border-radius:3px}
.hb .fill2{position:absolute;top:0;left:0;height:100%;border-radius:3px;border:1.5px solid rgba(18,24,33,.55);background:transparent}
.hb .v{font-family:var(--mono);font-size:12px;color:var(--text);white-space:nowrap;text-align:right;min-width:64px}
.hb .v span{color:var(--muted)}
.chart-cap{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.chart-key{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.chart-key i{display:inline-block;width:12px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding:0 2px;border-bottom:1px solid var(--border)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;cursor:pointer;position:relative;min-width:0}
.col .seg{width:100%}
.col .seg:first-child{border-radius:3px 3px 0 0}
.col .cv{font-family:var(--mono);font-size:11px;text-align:center;color:var(--text);margin-bottom:3px}
.col:hover .seg{filter:brightness(1.2)}
.col-labels{display:flex;gap:6px;padding:4px 2px 0}
.col-labels div{flex:1;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);min-width:0}
.col.empty .cv{color:var(--faint)}
/* Ladder */
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:12px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.rung{padding:14px 16px;background:var(--surface);border-right:1px solid var(--border);cursor:pointer;position:relative}
.rung:last-child{border-right:none}
.rung:hover{background:var(--surface2)}
.rung .step{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rung .nm{font-weight:650;margin-top:2px}
.rung .q{font-size:12.5px;color:var(--text2);margin-top:4px}
.rung .ct{margin-top:10px;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.rung .ct span{font-size:12px;color:var(--muted);font-weight:400}
.rung .top{position:absolute;left:0;top:0;right:0;height:3px}
/* Themes */
.theme-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;scroll-margin-top:20px}
.theme-card.flash{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.theme-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.theme-head h3{margin:0;font-size:18px}
.stat-row{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text2);margin-top:6px}
.stat-row b{color:var(--text);font-variant-numeric:tabular-nums}
.theme-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.mini-f{border-top:1px solid var(--border);padding:10px 0}
.mini-f:first-child{border-top:none}
.mini-f .quote{font-size:15px;margin:6px 0}
.mini-f .lim-inline{font-size:12.5px;color:#7f5600;margin-top:4px}
details.more > summary{cursor:pointer;color:var(--accent);font-size:13px;list-style:none;margin-top:10px}
details.more > summary::-webkit-details-marker{display:none}
.doc-list-mini{display:flex;flex-direction:column;gap:6px;font-size:13px}
.doc-list-mini .r{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
/* Matrix */
.matrix-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650;background:var(--bg2);position:sticky;top:0}
td{color:var(--text2);overflow-wrap:anywhere}
table.mx td,table.mx th{text-align:center;padding:5px;border:1px solid var(--bg)}
table.mx th.rh{text-align:right;white-space:nowrap;text-transform:none;letter-spacing:0;font-size:12px;color:var(--text2);font-weight:500}
table.mx th.ch{writing-mode:vertical-rl;transform:rotate(180deg);text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--text2);font-weight:500;height:150px;vertical-align:bottom;white-space:nowrap}
table.mx td.c{font-family:var(--mono);font-size:12px;cursor:pointer;min-width:30px}
table.mx td.c:hover{outline:1px solid var(--accent)}
table.mx td.diag{color:var(--muted);cursor:default}
/* Tiers */
.tier{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;scroll-margin-top:20px}
.tier-head{padding:16px 18px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px}
.tier-head h3{margin:0 0 4px;font-size:18px}
.tier-body{padding:16px 18px}
.subgroup{margin-top:14px}
.subgroup h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.empty-note{padding:14px;border:1px dashed var(--border2);border-radius:var(--radius-sm);color:var(--text2);font-size:13.5px}
/* Timeline */
.tl{position:relative;margin-left:8px}
.tl-year{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.tl-year .y{font-family:var(--mono);font-size:20px;font-weight:650}
.tl-year .line{flex:1;height:1px;background:var(--border)}
.tl-year .c{font-size:12px;color:var(--muted)}
.tl-gap{margin:18px 0;padding:10px 14px;border:1px dashed var(--border2);border-radius:var(--radius-sm);color:var(--muted);font-size:13px}
.tl-item{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;position:relative;padding-bottom:12px}
.tl-date{text-align:right;padding-top:12px}
.tl-date .d{font-family:var(--mono);font-size:12.5px;color:var(--text)}
.tl-date .p{font-size:11px;color:var(--muted);margin-top:2px}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;position:relative}
.tl-card:hover{border-color:var(--border2);background:var(--surface2)}
.tl-card::before{content:"";position:absolute;left:-10px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--dotc,var(--accent));box-shadow:0 0 0 3px var(--bg)}
.tl-card.ref{border-style:dashed;background:var(--bg2)}
.tl-card .t{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tl-card .desc{font-size:13.5px;color:var(--text2);margin-top:6px}
.tl-card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.prec{font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--border2);color:var(--text2)}
.prec.approx{border-style:dashed;color:#8f6100;border-color:rgba(214,150,20,.5)}
/* Network */
.net-wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}
.net-canvas{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);position:relative;overflow:hidden}
.net-canvas svg{display:block;width:100%;height:auto;touch-action:none}
.net-info{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;max-height:680px;overflow:auto}
.net-legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12px;color:var(--text2);margin:10px 0}
.net-legend .e{display:inline-flex;align-items:center;gap:6px}
.net-legend svg{vertical-align:middle}
.toggles{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--text2)}
.toggles label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.node{cursor:pointer}
.node text{font-size:10px;fill:var(--text2);pointer-events:none;font-family:var(--mono)}
.node.big text{font-size:12px;fill:var(--text);font-family:var(--sans);font-weight:600}
.dim{opacity:.12}
/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(20,28,40,.35);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(680px,100vw);background:var(--bg2);border-left:1px solid var(--border2);transform:translateX(100%);transition:transform .2s ease;z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.drawer-head .ttl{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-body{flex:1;overflow-y:auto;padding:18px}
.drawer-body h2{font-family:var(--mono);font-size:19px;margin:0 0 4px}
/* Report */
.report h3{margin-top:26px}
.report p,.report li{color:var(--text2)}
.report li{margin-bottom:8px}
.callout{border-left:3px solid var(--accent);padding:10px 14px;background:var(--surface);border-radius:0 var(--radius-sm) var(--radius-sm) 0;color:var(--text2);font-size:13.5px;margin:12px 0}
.callout.warn{border-left-color:#8f6100}
.val-ok{color:var(--ev-contrary)} .val-warn{color:#8f6100}
.banner{display:none;background:rgba(214,150,20,.1);border:1px solid rgba(214,150,20,.45);color:#6b4700;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:16px;font-size:13.5px}
.banner.on{display:block}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--border2);border-radius:var(--radius)}
.strong-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column}
.strong-card .quote{font-size:15px}
.strong-card .why{font-size:13px;color:var(--text2)}
.strong-card .not{font-size:13px;color:#7f5600;margin-top:6px}
.strong-card .f-actions{margin-top:auto;padding-top:10px}
.theme-row{display:grid;grid-template-columns:minmax(0,2.2fr) 90px minmax(0,1.4fr) minmax(0,1.8fr);gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);align-items:start;cursor:pointer}
.theme-row:hover{background:var(--surface2)}
.theme-row.head{cursor:default;background:var(--bg2);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}
.theme-row.head:hover{background:var(--bg2)}
.theme-row .nm{font-weight:600}
.theme-row .ds{font-size:12.5px;color:var(--text2);margin-top:2px}
.theme-row .n{font-family:var(--mono);font-size:13px}
.rel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.rel-card .pair{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600;font-size:13.5px}
.rel-card .basis{font-size:11.5px;color:var(--muted);margin-top:4px}
.rel-card p{font-size:13px;color:var(--text2);margin:6px 0}
/* Responsive */
@media (max-width: 1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .net-wrap{grid-template-columns:1fr} .net-info{max-height:none} }
@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;gap:10px;border-right:none;border-bottom:1px solid var(--border)}
  .brand,.side-block{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav a{white-space:nowrap;padding:6px 10px}
  .nav a .n{display:none}
  .g2,.g3,.theme-cols,.ann{grid-template-columns:1fr}
  .ladder{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rung:nth-child(2){border-right:none}
  .rung:nth-child(-n+2){border-bottom:1px solid var(--border)}
  .doc-head{grid-template-columns:1fr}
  .doc-actions{flex-direction:row;align-items:center;justify-content:space-between}
  .tl-item{grid-template-columns:1fr;gap:4px}
  .tl-date{text-align:left;padding-top:0}
  .tl-card::before{display:none}
  .theme-row{grid-template-columns:1fr 70px}
  .theme-row > :nth-child(3),.theme-row > :nth-child(4){grid-column:1 / -1}
  .theme-row.head > :nth-child(3),.theme-row.head > :nth-child(4){display:none}
  .kv{grid-template-columns:1fr}
  .toolbar{position:static}
  .hb{grid-template-columns:minmax(90px,130px) minmax(0,1fr) auto}
}
@media (max-width: 520px){ .g4{grid-template-columns:1fr} .ladder{grid-template-columns:1fr} .rung{border-right:none;border-bottom:1px solid var(--border)} }
@media print{ .sidebar,.toolbar,.drawer,.overlay{display:none} .section{display:block} body{background:#fff;color:#000} }
</style>
</head>

</aside>

const THEMES = [
 {id:'habit_science', name:'Reward, reinforcement & habit research', short:'Habit research', re:/reward|reinforcement|habit|dopamine|loss of control/i,

  summary:'Facebook researchers described platform use in the vocabulary of behavioral psychology: rewards that are always available, limitless and unpredictable; cues that trigger automatic, learned responses; dopamine activation from social approval; and notifications that prompt unplanned use and reduce feelings of control. The vocabulary appears in an internal well-being research deck and in a peer-reviewed paper by company researchers that the deck cites.',
  interp:'By 2019, company researchers understood and actively studied reward, reinforcement and habit mechanisms in relation to their own product. This supports corporate knowledge and investigation.',

 {id:'problematic_use', name:'Internal framing of addiction & problematic use', short:'Addiction framing', re:/addict|problematic use/i,

  interp:'Addiction-related concepts were discussed inside Meta and Snap by research, AI and product staff, not only by outside critics.',

 {id:'habit_goal', name:'Daily habit as an explicit product objective', short:'Habit as goal', re:/daily habit|habit|daily behaviors|every ?day/i,

  interp:'This is the dataset’s strongest cluster for product-design intent toward repeated use: habit formation is stated as an objective rather than merely observed.',

 {id:'notifications', name:'Notifications as behavioral triggers', short:'Notifications', re:/notification|push/i,
  what:'Notifications as a lever that prompts use — and as a recognized source of reduced control.',
  summary:'Facebook research associated notification volume with self-reported problematic use and described notifications as prompting use people would not otherwise have chosen; the same researchers recommended turning notifications off, especially at bedtime. A Snap business review proposed using notifications so users “never miss” Stories. The 2026 consent judgment limits nighttime push notifications.',

  summary:'Teens in Instagram’s research described endless content as “addicting” and the Explore page as designed to keep them scrolling. A Snap Discover outline asks how content and UI can take users down “engagement rabbit holes”, and a reviewer comment notes a redesign introduced infinite scroll. The consent judgment treats restricting autoplay as a protection against excessive use.',

 {id:'streaks', name:'Snapstreaks: gamified social obligation', short:'Streaks', re:/streak/i,
  what:'Snapchat’s Streaks feature and how the company and users described it.',
  summary:'In January 2019 a Snap product lead wrote that Streaks were “accidentally addictive”, “somewhat unhealthy”, and too delicate to change; that a few million users probably only use the app for streaks; and declined to add streak-expiry notifications that would “exacerbate the problem”. Three months earlier a high-school student emailed the CEO asking about teen Streaks addiction.',

 {id:'algorithms', name:'Algorithmic ranking & harmful engagement', short:'Algorithms', re:/algorithm|ranking|recommend|reinforcement learning/i,

function companyOf(r){
  const tests = [r.author_or_organization, r.document_type, r.document_context];
  for (const s of tests){
    if (/\bSnap\b|Snapchat/i.test(s)) return 'Snap Inc.';
    if (/TikTok|ByteDance/i.test(s)) return 'TikTok';
    if (/YouTube|Google/i.test(s)) return 'YouTube (Google)';
    if (/\bMeta\b|Facebook|Instagram/i.test(s)) return 'Meta (Facebook / Instagram)';
  }
  return 'Unattributed';
}
function platformOf(r){
  const s = r.author_or_organization;
  if (/Instagram/i.test(s) && /Facebook/i.test(s)) return 'Facebook & Instagram';
  if (/Instagram/i.test(s)) return 'Instagram';
  if (/Facebook/i.test(s)) return 'Facebook';
  if (/Snap/i.test(s)) return 'Snapchat';
  if (/TikTok/i.test(s)) return 'TikTok';
  if (/YouTube/i.test(s)) return 'YouTube';
  if (/Meta Platforms/i.test(s)) return 'Meta';
  return '';
}
function sourceTypeOf(r){
  const s = r.author_or_organization + ' | ' + r.document_type;
  if (/court filing|consent judgment|joint motion/i.test(s)) return 'Litigation filing';
  if (/expert report/i.test(s)) return 'Plaintiff expert report';
  if (/published research paper/i.test(s)) return 'Company-authored published research';
  if (/^(Facebook user|High-school student|Third party)|user feedback data|user message/i.test(s)) return 'Outside voice in company records';
  return 'Internal corporate document';
}
function docTypeNorm(t){
  if (/court filing/i.test(t)) return 'Court filing';
  if (/expert report/i.test(t)) return 'Expert report';
  if (/published research paper/i.test(t)) return 'Published research paper';
  if (/spreadsheet|\.xlsx/i.test(t)) return 'Data export';
  if (/^email|email thread|message|chat/i.test(t)) return 'Email / message';
  if (/deck|presentation/i.test(t)) return 'Presentation / deck';
  if (/research note|literature review|research report|market research/i.test(t)) return 'Research report / note';
  if (/strategy|outline|one-pager|plan/i.test(t)) return 'Strategy / planning document';
  return 'Other';
}
const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const MONRE = '(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?';
function parseDate(raw){
  const s = String(raw || '').trim();
  const o = {raw:s, key:'9999-12-31', year:null, precision:'Undated', approx:false, basis:'As recorded'};
  if (!s) return o;
  o.approx = /\bc\.|circa|inferred|uncertain|undated|unknown|approx|\blate\b|\bearly\b/i.test(s);
  const iso = [...s.matchAll(/((?:19|20)\d{2})-(\d{2})-(\d{2})/g)];
  let m;
  if (iso.length){
    o.key = `${iso[0][1]}-${iso[0][2]}-${iso[0][3]}`; o.year = +iso[0][1];
    o.precision = (iso.length > 1 && /\bto\b/i.test(s)) ? 'Day range' : 'Exact day';
  } else if ((m = s.match(new RegExp(MONRE + '\\s*[-–/]\\s*' + MONRE + '\\s+((?:19|20)\\d{2})', 'i')))){
    o.key = `${m[3]}-${pad(MON[m[1].toLowerCase()])}-01`; o.year = +m[3]; o.precision = 'Month range';
  } else if ((m = s.match(new RegExp('\\b' + MONRE + '\\s+((?:19|20)\\d{2})', 'i')))){
    o.key = `${m[2]}-${pad(MON[m[1].toLowerCase()])}-01`; o.year = +m[2]; o.precision = 'Month';
  } else if ((m = s.match(/\bQ([1-4])\s+((?:19|20)\d{2})/i))){
    o.key = `${m[2]}-${pad((m[1]-1)*3+1)}-01`; o.year = +m[2]; o.precision = 'Quarter';
  } else if ((m = s.match(/\b((?:19|20)\d{2})\b/))){
    const late = /late/i.test(s), early = /early/i.test(s) && !late;
    o.key = `${m[1]}-${late ? '10' : early ? '02' : '07'}-01`; o.year = +m[1]; o.precision = 'Year'; o.approx = true;
  }
  if (/filed/i.test(s)) o.basis = 'Filing date';
  else if (/metadata/i.test(s)) o.basis = 'File metadata';
  else if (/timestamp/i.test(s)) o.basis = 'Data-row timestamp';
  else if (/inferred/i.test(s)) o.basis = 'Inferred by reviewer';
  else if (/undated/i.test(s)) o.basis = 'Undated on face; estimated';
  else if (o.approx) o.basis = 'Approximate';
  else if (/deck date|dated|\(CHI/i.test(s)) o.basis = 'Date on document';
  return o;
}
function autoClassify(f){
  const text = f.exact_quote + ' ' + f.relevance_explanation;
  const m = Object.keys(MECH).filter(k => MECH[k].re.test(text));
  const ev = []; let ds = null, ot = null, kt = null;
  const c = f.finding_category;
  if (/addiction/i.test(c)) { ev.push('knowledge'); kt = 'internal'; }
  if (/scientific|research/i.test(c)) ev.push('investigation');
  if (/product|engineering|design/i.test(c)) { ev.push('design'); ds = 'review'; }
  if (/consumer|behavio/i.test(c)) { ev.push('outcome'); ot = 'review'; }
  if (/contrary|mitigat|denies|disputes|reduce problematic/i.test(f.relevance_explanation + ' ' + f.interpretation_limitations)) ev.push('contrary');
  if (!ev.filter(e => e !== 'contrary').length) ev.push('context');
  const th = THEMES.filter(t => t.re.test(text)).map(t => t.id);
  return {ev, kt, ds, ot, mechs:m, themes:th};
}

    if (!d){
      d = {rid:f.rid, name:f.document_name, link:f.google_drive_link, dateRaw:f.document_date, date:f.date, type:f.document_type, docType:f.docType,
           batch:f.batch_number, company:f.company, platform:f.platform, sourceType:f.sourceType, authors:[], contexts:[], relatedRaw:[], findings:[], inconsistent:[]};
      docById[f.rid] = d; docs.push(d);
    } else {
      [['document_name','name'],['google_drive_link','link'],['document_date','dateRaw'],['document_type','type'],['batch_number','batch']].forEach(([k, dk]) => {
        if (f[k] !== d[dk] && !d.inconsistent.includes(k)) { d.inconsistent.push(k); issues.push({level:'warn', text:`${f.rid}: ${k} differs between findings (${f.id}).`}); }
      });
    }
    if (f.author_or_organization && !d.authors.includes(f.author_or_organization)) d.authors.push(f.author_or_organization);
    if (f.document_context && !d.contexts.includes(f.document_context)) d.contexts.push(f.document_context);
    if (f.related_documents && !d.relatedRaw.includes(f.related_documents)) d.relatedRaw.push(f.related_documents);
    d.findings.push(f); f.doc = d;
  });
  docs.forEach(d => {
    d.findings.sort(by(f => f.id));
    d.maxRank = Math.max(...d.findings.map(f => f.relRank));
    d.relevance = REL_ORDER.find(r => REL_RANK[r] === d.maxRank) || '—';
    d.relCounts = Object.fromEntries(REL_ORDER.map(r => [r, d.findings.filter(f => f.relevance_level === r).length]));
    d.cats = uniq(d.findings.map(f => f.finding_category));
    d.themes = uniq(d.findings.flatMap(f => f.themes));
    d.mechs = uniq(d.findings.flatMap(f => f.mechs));
    d.ev = uniq(d.findings.flatMap(f => f.ev));
    d.summary = DOC_SUMMARY[d.rid] || null;
    const meta = [...d.authors, d.type, ...d.contexts].join(' || ');
    d.people = PEOPLE.filter(p => p.re.test(meta)).map(p => p.name);
    d.num = parseInt((d.rid.match(/\d+/) || ['0'])[0], 10);
  });
  // ---- Relationships from related_documents + duplicate statements
  const edgeMap = new Map(); const externalRefs = [];
  const addEdge = (a, b, type, label, origin) => {
    if (a === b) return;
    const k = [a, b].sort().join('|');
    let e = edgeMap.get(k);
    if (!e){ e = {a:[a,b].sort()[0], b:[a,b].sort()[1], types:new Set(), labels:[], origins:new Set()}; edgeMap.set(k, e); }
    e.types.add(type); if (label && !e.labels.includes(label)) e.labels.push(label); e.origins.add(origin);
  };
  const classifySeg = s => /same document|same deck/i.test(s) ? 'duplicate' : /\bcit(es|ing|ed)\b/i.test(s) ? 'citation' : /same\b[^;]*?\b(workstream|program|team|crisis|plan)\b/i.test(s) ? 'initiative' : 'topical';
  docs.forEach(d => {
    d.relatedRaw.forEach(raw => raw.split(';').forEach(seg => {
      seg = seg.trim(); if (!seg) return;
      const type = classifySeg(seg);
      const ids = new Set((seg.match(/DOC-\d{4}/g) || []));
      (seg.match(/FIND-\d{4}/g) || []).forEach(fid => { if (findById[fid]) ids.add(findById[fid].rid); });
      const rng = seg.match(/FIND-(\d{4})\s+to\s+FIND-(\d{4})/);
      if (rng) for (let n = +rng[1]; n <= +rng[2]; n++){ const fid = 'FIND-' + pad4(n); if (findById[fid]) ids.add(findById[fid].rid); }
      ids.forEach(id => {
        if (id === d.rid) return;
        if (docById[id]) addEdge(d.rid, id, type, seg, 'related_documents of ' + d.rid);
        else externalRefs.push({from:d.rid, ref:id, text:seg});
      });
    }));
    const dupText = [...d.contexts, ...d.findings.map(f => f.interpretation_limitations)].join(' ');
    const dm = [...dupText.matchAll(/(?:Duplicate of|Same deck as|Same [\w\s'’]*?document as)\s*(DOC-\d{4})/gi)];
    dm.forEach(mm => { if (docById[mm[1]]) addEdge(d.rid, mm[1], 'duplicate', mm[0], 'document_context / limitations of ' + d.rid); });
  });
  const edges = [...edgeMap.values()].map(e => {
    const order = ['duplicate','citation','initiative','topical'];
    e.type = order.find(t => e.types.has(t)); e.typesArr = [...e.types]; e.originsArr = [...e.origins]; return e;
  });
  // duplicate clusters → canonical ids
  const parent = {}; const find = x => parent[x] === undefined || parent[x] === x ? (parent[x] = x) : (parent[x] = find(parent[x]));
  edges.filter(e => e.types.has('duplicate')).forEach(e => { const ra = find(e.a), rb = find(e.b); if (ra !== rb){ if (ra < rb) parent[rb] = ra; else parent[ra] = rb; } });
  docs.forEach(d => { d.canon = find(d.rid); d.dupOf = d.canon !== d.rid ? d.canon : null; });
  docs.forEach(d => { d.dupPeers = docs.filter(x => x.canon === d.canon && x.rid !== d.rid).map(x => x.rid); });
  // people edges
  const people = PEOPLE.map(p => ({...p, docs:docs.filter(d => d.people.includes(p.name)).map(d => d.rid)})).filter(p => p.docs.length);
  // stale annotations
  const staleAnn = Object.keys(ANN).filter(k => !findById[k]);
  const companies = uniq(docs.map(d => d.company)).sort(by(c => -docs.filter(d => d.company === c).length));
  const categories = uniq(findings.map(f => f.finding_category)).sort(by(c => -findings.filter(f => f.finding_category === c).length));
  const docTypes = uniq(docs.map(d => d.docType)).sort();
  const batches = uniq(docs.map(d => d.batch)).sort((a, b) => (+a) - (+b));
  const years = uniq(docs.map(d => d.date.year).filter(Boolean)).sort();
  return {sourceLabel, rows, findings, docs, findById, docById, edges, externalRefs, people, staleAnn, companies, categories, docTypes, batches, years, issues};
}
function pad4(n){ return String(n).padStart(4, '0'); }

function barKey(){ return `<div class="chart-key"><span><i style="background:#0a6fa8"></i>findings</span><span><i style="border:1.5px solid rgba(18,24,33,.55)"></i>unique documents</span></div>`; }
function range(a, b){ const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }

const docF = {q:'', relevance:'', company:'', docType:'', category:'', batch:'', from:'', to:'', sort:'date'};

function docHay(d){ return [d.rid, d.name, d.company, d.platform, ...d.authors, d.type, d.docType, d.dateRaw, ...d.contexts, ...d.relatedRaw, d.summary,
  ...d.findings.flatMap(f => [f.id, f.exact_quote, f.finding_category, f.relevance_explanation, f.interpretation_limitations, f.evidence_location, ...f.mechs.map(m => MECH[m]?.label), ...f.themes.map(t => THEME_BY[t]?.name)])].join(' \n ').toLowerCase(); }
function matchQ(hay, q){ const terms = q.toLowerCase().split(/\s+/).filter(Boolean); return terms.every(t => hay.includes(t)); }
function opt(v, label, sel){ return `<option value="${esc(v)}" ${String(sel) === String(v) ? 'selected' : ''}>${esc(label)}</option>`; }
function yearOpts(sel){ return opt('', 'Any') + D.years.map(y => opt(y, y, sel)).join(''); }

function resetDocF(){ Object.assign(docF, {q:'', relevance:'', company:'', docType:'', category:'', batch:'', from:'', to:'', sort:'date'}); }
function filteredDocs(){
  let L = D.docs.filter(d =>
    (!docF.q || matchQ(docHay(d), docF.q)) && (!docF.relevance || d.relevance === docF.relevance) && (!docF.company || d.company === docF.company) &&
    (!docF.docType || d.docType === docF.docType) && (!docF.category || d.cats.includes(docF.category)) && (!docF.batch || String(d.batch) === String(docF.batch)) &&
    (!docF.from || (d.date.year && d.date.year >= +docF.from)) && (!docF.to || (d.date.year && d.date.year <= +docF.to)));
  const s = docF.sort;
  L.sort(s === 'relevance' ? (a, b) => b.maxRank - a.maxRank || b.findings.length - a.findings.length || a.date.key.localeCompare(b.date.key)
       : s === 'findings' ? (a, b) => b.findings.length - a.findings.length || b.maxRank - a.maxRank
       : s === 'id' ? by(d => d.rid) : (a, b) => a.date.key.localeCompare(b.date.key) || a.rid.localeCompare(b.rid));
  return L;
}

const evF = {q:'', groups:[], relevance:'', company:'', category:'', mech:'', themes:[], source:'', batch:'', from:'', to:'', rid:'', sort:'relevance'};
function resetEvF(){ Object.assign(evF, {q:'', groups:[], relevance:'', company:'', category:'', mech:'', themes:[], source:'', batch:'', from:'', to:'', rid:'', sort:'relevance'}); }
function fHay(f){ return [f.id, f.rid, f.document_name, f.company, f.platform, f.author_or_organization, f.document_type, f.document_date, f.finding_category, f.relevance_level, f.exact_quote, f.evidence_location, f.document_context, f.relevance_explanation, f.interpretation_limitations, f.related_documents, ...f.ev.map(k => EV[k].label), ...f.mechs.map(m => MECH[m]?.label), ...f.themes.map(t => THEME_BY[t]?.name)].join(' \n ').toLowerCase(); }
function filteredFindings(){
  let L = D.findings.filter(f =>
    (!evF.q || matchQ(fHay(f), evF.q)) && (!evF.groups.length || evF.groups.some(g => f.ev.includes(g))) && (!evF.relevance || f.relevance_level === evF.relevance) &&
    (!evF.company || f.company === evF.company) && (!evF.category || f.finding_category === evF.category) && (!evF.mech || f.mechs.includes(evF.mech)) &&
    (!evF.themes.length || evF.themes.every(t => f.themes.includes(t))) && (!evF.source || f.sourceType === evF.source) && (!evF.batch || String(f.batch_number) === String(evF.batch)) &&
    (!evF.from || (f.date.year && f.date.year >= +evF.from)) && (!evF.to || (f.date.year && f.date.year <= +evF.to)) && (!evF.rid || f.rid === evF.rid));
  L.sort(evF.sort === 'date' ? (a, b) => a.date.key.localeCompare(b.date.key) || a.id.localeCompare(b.id) : evF.sort === 'id' ? by(f => f.id) : (a, b) => b.relRank - a.relRank || a.date.key.localeCompare(b.date.key) || a.id.localeCompare(b.id));
  return L;
}

function renderTimeline(){
  const fMatch = f => (!tlF.category || f.finding_category === tlF.category) && (!tlF.relevance || f.relevance_level === tlF.relevance) && (!tlF.mech || f.mechs.includes(tlF.mech)) && (!tlF.theme || f.themes.includes(tlF.theme));
  const yr = y => (!tlF.from || (y && y >= +tlF.from)) && (!tlF.to || (y && y <= +tlF.to));
  const docs = D.docs.filter(d => (!tlF.company || d.company === tlF.company) && d.findings.some(fMatch) && yr(d.date.year));
  const refs = tlF.refs ? REF_EVENTS.filter(r => D.findById[r.f]).filter(r => { const f = D.findById[r.f]; return (!tlF.company || f.company === tlF.company) && fMatch(f) && yr(+r.key.slice(0, 4)); }) : [];
  const items = [...docs.map(d => ({k:d.date.key, d})), ...refs.map(r => ({k:r.key, r}))].sort((a, b) => a.k.localeCompare(b.k) || (a.d ? a.d.rid : 'z').localeCompare(b.d ? b.d.rid : 'z'));

      const n = items.filter(x => +x.k.slice(0, 4) === y && x.d).length;
      html += `<div class="tl-year"><span class="y">${y}</span><span class="line"></span><span class="c">${plural(n, 'document')}</span></div>`; lastY = y;

      const d = it.d, fs = d.findings.filter(fMatch);
      html += `<div class="tl-item"><div class="tl-date"><div class="d">${esc(d.dateRaw.length > 44 ? d.dateRaw.slice(0, 42) + '…' : d.dateRaw)}</div><div class="p">${precBadge(d.date)}</div></div>

          <div class="desc">${d.summary ? `${PROV.synth} ${esc(d.summary)}` : esc(d.contexts[0] || '')}</div>

          <div class="acts"><span class="btn sm">${plural(fs.length, 'matching finding')} · open quotations</span><button type="button" class="btn sm ghost" data-act="ev" data-f="${jattr({rid:d.rid})}">Evidence Explorer →</button>${viewOrig(d.link, true)}</div>
        </div></div>`;
    } else {
      const r = it.r, f = D.findById[r.f];
      html += `<div class="tl-item"><div class="tl-date"><div class="d">${esc(r.label)}</div><div class="p"><span class="prec approx">referenced event</span></div></div>
        <div class="tl-card ref" style="--dotc:transparent" data-act="find" data-v="${esc(r.f)}" role="button" tabindex="0">

function renderIntent(){
  const mini = f => `<div class="mini-f"><div class="f-top">${idChip(f.id)} ${relBadge(f.relevance_level)} ${companyBadge(f.company)} <span class="mono small" data-act="doc" data-v="${f.rid}" style="cursor:pointer">${esc(f.document_name)}</span> <span class="muted small">${esc(f.document_date)}</span>${f.ds && f.ev.includes('design') ? `<span class="badge">${esc(DS_LABEL[f.ds])}</span>` : ''}${f.ot && f.ev.includes('outcome') ? `<span class="badge">${esc(OT_LABEL[f.ot])}</span>` : ''}${f.kt === 'notice' && f.ev.includes('knowledge') ? '<span class="badge">Outside notice</span>' : ''}</div>
    <blockquote class="quote" data-act="find" data-v="${f.id}">${esc(f.exact_quote)}</blockquote>
    <div class="lim-inline"><b>Limitation (CSV):</b> ${esc(f.interpretation_limitations)}</div>
    <div style="margin-top:6px">${viewOrig(f.google_drive_link, true)}</div></div>`;
  const group = (title, fs, note) => `<div class="subgroup"><h4>${esc(title)} · ${fs.length}</h4>${note ? `<p class="small muted" style="margin:0 0 6px">${note}</p>` : ''}${fs.length ? fs.map(mini).join('') : '<div class="empty-note">No findings in this sub-group.</div>'}</div>`;
  const srt = fs => [...fs].sort((a, b) => b.relRank - a.relRank || a.date.key.localeCompare(b.date.key));
  const tierLimits = {
    knowledge:'Awareness of a mechanism, a concern, or a user complaint does not show that the company intended to exploit it. Outside notice shows only that information reached the company; how it was handled is not recorded.',
    investigation:'Investigation was often framed around understanding or reducing problematic use. Studying a mechanism is not the same as deploying it, and most measurements are correlational.',
    design:'All design-related findings are either proposals and open questions, or decisions about an existing feature. The CSV does not document which proposals were adopted, and does not record a decision to build a feature with the stated goal of making a product addictive.',
    outcome:'Measured outcomes are correlational survey or log associations; self-reports are individual perceptions. None establishes that a specific feature caused compulsive or harmful use, and none is a clinical diagnosis.'
  };
  const tiers = TIER_KEYS.map(k => {
    const fs = srt(evFindings(k)); const e = EV[k];
    let groups = '';
    if (!fs.length) groups = `<div class="empty-note"><b>The available findings do not support this category.</b> No finding in the current CSV has been classified here.</div>`;
    else if (k === 'knowledge') groups = group(KT_LABEL.internal, fs.filter(f => f.kt !== 'notice')) + group(KT_LABEL.notice, fs.filter(f => f.kt === 'notice'), 'Signals that reached the company from users, research participants, parents or press. These establish notice at most.');
    else if (k === 'design') groups = group(DS_LABEL.decision, fs.filter(f => f.ds === 'decision'), 'Documented decisions about features. In this dataset these concern keeping an existing feature (Streaks) and declining to intensify it.') + group(DS_LABEL.proposed, fs.filter(f => f.ds === 'proposed'), 'Pitches, outlines, open questions and option lists stating engagement or habit objectives. Adoption is not shown.') + (fs.some(f => f.ds === 'review') ? group(DS_LABEL.review, fs.filter(f => f.ds === 'review')) : '');
    else if (k === 'outcome') groups = group(OT_LABEL.measured, fs.filter(f => f.ot === 'measured'), 'Associations measured by company research. Correlational; not causal.') + group(OT_LABEL.self, fs.filter(f => f.ot === 'self'), 'Individual users or focus-group participants describing their own experience.') + (fs.some(f => f.ot === 'review') ? group(OT_LABEL.review, fs.filter(f => f.ot === 'review')) : '');
    else groups = group('All findings', fs);
    return `<section class="tier" id="tier-${k}">
      <div class="tier-head" style="border-top:3px solid ${e.hex}"><div><div class="muted small mono">Step ${e.step} · ${esc(e.verb)}</div><h3>${esc(e.label)}</h3><p class="muted" style="margin:0;font-size:13.5px">${esc(e.def)}</p></div>
        <div style="text-align:right"><div style="font-size:26px;font-weight:650">${fs.length}</div><div class="muted small">findings · ${distinctDocs(fs).length} docs</div><button type="button" class="btn sm" style="margin-top:6px" data-act="ev" data-f="${jattr({groups:[k]})}">Open in Evidence Explorer</button></div></div>
      <div class="tier-body"><div class="callout warn" style="margin-top:0"><b>Limitations ${PROV.synth}</b> ${esc(tierLimits[k])}</div>${groups}</div>
    </section>`;
  }).join('');
  // company x tier matrix
  const cos = D.companies;
  const cell = (c, k) => distinctDocs(D.findings.filter(f => f.company === c && f.ev.includes(k))).length;
  const contr = srt(evFindings('contrary'));
  $('#sec-intent').innerHTML = `
  <div class="sec-head"><div class="kicker">Section F</div><h2>Corporate Knowledge vs. Product Design Intent</h2>
    <p>The central distinction of this research: what companies <em>understood</em> is separated from what they <em>studied</em>, what they <em>designed or decided</em>, and what <em>outcomes</em> were observed. Classification is dashboard synthesis; a finding can appear in more than one group, and a document can appear in several.</p></div>
  <div class="synth-box">${PROV.synth}
    <p style="margin:0 0 8px;color:var(--text2)"><b>Reading across the four groups.</b> The dataset is strongest on awareness and investigation: Meta researchers studied reward, habit and notification mechanisms and measured problematic use, and Snap staff described Streaks as addictive. Evidence of design intent is narrower — it consists of Snap pitches and outlines that set daily habit and deeper engagement as objectives, a Snap option list proposing notifications, a Facebook proposal to replicate conditions that retain tweens, and Snap’s decision to keep Streaks while declining to intensify them. Outcome evidence is correlational or self-reported.</p>
    <p style="margin:0;color:var(--text2)"><b>What is absent.</b> No finding in this CSV documents the adoption of a feature built with the stated purpose of making a product addictive, and no finding establishes that a feature caused compulsive or harmful use. These gaps describe the current dataset, not the full archive.</p>
  </div>
  <div class="block"><h3>Company × evidence level (distinct documents)</h3>
    <p class="muted small" style="margin:0 0 10px">How many distinct documents from each company contain at least one finding at each level. Differences reflect what has been reviewed and recorded so far, not differences in conduct. Click a cell to open the findings.</p>
    <div class="panel matrix-wrap"><table><thead><tr><th>Company</th>${[...TIER_KEYS, 'contrary', 'context'].map(k => `<th style="color:${EV[k].hex}">${esc(EV[k].verb)}</th>`).join('')}<th>Docs total</th></tr></thead>
    <tbody>${cos.map(c => `<tr><td>${companyBadge(c)}</td>${[...TIER_KEYS, 'contrary', 'context'].map(k => { const n = cell(c, k); return `<td class="mono" ${n ? `data-act="ev" data-f="${jattr({company:c, groups:[k]})}" style="cursor:pointer;color:var(--text)"` : 'style="color:var(--faint)"'}>${n || '—'}</td>`; }).join('')}<td class="mono">${uniq(D.docs.filter(d => d.company === c).map(d => d.canon)).length}</td></tr>`).join('')}</tbody></table></div>
  </div>
  <div class="block">${tiers}</div>
  <section class="tier" id="tier-contrary"><div class="tier-head" style="border-top:3px solid ${EV.contrary.hex}"><div><h3>${esc(EV.contrary.label)}</h3><p class="muted" style="margin:0;font-size:13.5px">${esc(EV.contrary.def)} These findings are shown here so that they are weighed alongside the four groups above, not excluded.</p></div>
    <div style="text-align:right"><div style="font-size:26px;font-weight:650">${contr.length}</div><div class="muted small">findings</div></div></div>
    <div class="tier-body">${contr.length ? contr.map(mini).join('') : '<div class="empty-note">No contradictory or limiting findings classified.</div>'}</div></section>`;
}

      <li>Coverage is uneven: Meta and Snap dominate; TikTok and YouTube are represented by only a few documents each.</li>
      <li>Almost all internal documents date from 2017–2019; no documents are dated 2020–2024, and later material is litigation.</li>
      <li>Quotations came from an AI-assisted review, some via text extraction from scans; several carry “sic” or extraction notes and should be checked against page images.</li>
      <li>The dataset contains no evidence of causation and no product launch dates.</li>
    </ul>
    <h3>6. Questions for further archival research</h3>
    <ul>
      <li>Which Friend Stories options were adopted? The deck references “Friend Story & App Retention” and “Friend Story Inventory + Availability Deep Dive”, not yet seen ${c('FIND-0019')}.</li>
      <li>What were the “other ways to encourage daily behaviors” Snap pursued in 2019 ${c('FIND-0018')}?</li>
      <li>Is there documentation of the intent behind the “Cheetah” redesign that introduced infinite scroll ${c('FIND-0032')}?</li>
      <li>Did Facebook’s problematic-use research lead to product changes, e.g. notification defaults? Locate Davis (2018a) “Facebook Addiction” and Davis (2018b) cited in ${dc('DOC-0008')}.</li>
      <li>Was the action to “replicate” conditions that retain tweens carried out ${c('FIND-0043')}?</li>
      <li>How were user and public reports of addiction handled ${c('FIND-0022')} ${c('FIND-0023')} ${c('FIND-0049')}?</li>

      <li>Look for 2020–2024 internal documents, and for TikTok and YouTube documents on recommendation and autoplay design.</li>
    </ul>
  </div>`;
}

/* =====================================================================
   15. SECTION H — METHODOLOGY & VALIDATION
   ===================================================================== */
function computeValidation(){
  const F = D.findings, docs = D.docs;
  const missing = FIELDS.map(k => ({k, n:F.filter(f => !String(f[k]).trim()).length})).filter(x => x.n);
  const badLinks = docs.filter(d => !d.link || !DRIVE_RE.test(d.link));
  const linkDupes = uniq(docs.map(d => d.link)).filter(l => docs.filter(d => d.link === l).length > 1);
  const nameDupes = uniq(docs.map(d => d.name)).filter(n => docs.filter(d => d.name === n).length > 1);
  const quoteDupes = []; const seen = {};
  F.forEach(f => { const q = f.exact_quote.trim(); if (seen[q]) quoteDupes.push([seen[q], f.id]); else seen[q] = f.id; });
  const authorUnknown = F.filter(f => /not identified|not shown|redacted|unknown|likely/i.test(f.author_or_organization));
  const dateApprox = docs.filter(d => d.date.approx || !d.date.year);
  const noRelated = F.filter(f => /^none identified$/i.test(f.related_documents.trim()));
  const extraction = F.filter(f => /\bsic\b|text extraction|unclear in the scan|verify against page|fragmented/i.test(f.evidence_location + ' ' + f.interpretation_limitations));
  const incompleteRecords = F.filter(f => authorUnknown.includes(f) || f.date.approx || !f.date.year || noRelated.includes(f));
  const reviewed = uniq(F.map(f => f.date_reviewed));
  const authorVariants = D.companies.map(c => ({c, n:uniq(F.filter(f => f.company === c).map(f => f.author_or_organization)).length}));
  const typeVariants = uniq(F.map(f => f.document_type)).length;
  return {F, docs, missing, badLinks, linkDupes, nameDupes, quoteDupes, authorUnknown, dateApprox, noRelated, extraction, incompleteRecords, reviewed, authorVariants, typeVariants};
}

  const renderedFindings = D.findings.length; // every finding is rendered by Evidence Explorer with no default filter
  $('#sec-method').innerHTML = `

        <li>The CSV may represent only a subset of the larger archive. It does not record how many documents the archive contains or how many were reviewed without findings, so this dashboard makes no claim about archive size.</li>
      </ul></div>
    <div class="panel"><h3>How to interpret findings</h3>
      <ul style="color:var(--text2);padding-left:18px;margin:0">
        <li><b>Relevance</b> (High / Moderate / Low) describes research importance assigned during review — not conclusive proof of addiction or wrongdoing.</li>
        <li>Quotations and interpretations should be verified against the original documents using the “View Original Document ↗” links.</li>
        <li>The dashboard does not independently establish whether any product causes clinical addiction.</li>

      <tr><td>Distinct underlying documents</td><td class="mono">${uniq(v.docs.map(d => d.canon)).length}</td><td>${D.docs.filter(d => d.dupOf).map(d => `${docChip(d.rid)} duplicates ${docChip(d.dupOf)}`).join('<br>') || 'No duplicates detected'}</td></tr>

      <tr><td>Records with incomplete metadata</td><td class="mono">${v.incompleteRecords.length} findings</td><td class="small">Author not identified / redacted / “likely”: ${v.authorUnknown.length} findings · Approximate, inferred or undated document date: ${v.dateApprox.length} documents (${D.findings.filter(f => f.date.approx).length} findings) · related_documents “None identified”: ${v.noRelated.length} findings</td></tr>
      <tr><td>Duplicate quotations</td><td class="mono">${v.quoteDupes.length}</td><td class="small">${v.quoteDupes.map(p => `${idChip(p[0])} = ${idChip(p[1])}`).join(' · ') || 'None'} ${v.quoteDupes.length ? '— same text in duplicate filings; kept as separate records, counted once in theme document counts.' : ''}</td></tr>

/* =====================================================================
   16. CSV I/O
   ===================================================================== */
function parseCSV(text){
  const rows = []; let row = [], field = '', i = 0, q = false;
  text = text.replace(/^\uFEFF/, '');
  while (i < text.length){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ field += '"'; i += 2; continue; } q = false; i++; continue; } field += ch; i++; continue; }
    if (ch === '"'){ q = true; i++; continue; }
    if (ch === ','){ row.push(field); field = ''; i++; continue; }
    if (ch === '\r'){ i++; continue; }
    if (ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += ch; i++;
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(c => c.trim())).map(r => Object.fromEntries(head.map((h, j) => [h, r[j] ?? ''])));
}
function toCSV(rows, cols){ const cell = v => { v = String(v ?? ''); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }; return [cols.join(','), ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\r\n'); }
function download(name, text){ const b = new Blob(['\uFEFF' + text], {type:'text/csv;charset=utf-8'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function exportFindings(fs, name){
  const extra = ['dashboard_company','dashboard_source_type','dashboard_evidence_levels','dashboard_design_status','dashboard_outcome_type','dashboard_mechanisms','dashboard_themes','dashboard_classification'];
  const rows = fs.map(f => ({...Object.fromEntries(FIELDS.map(k => [k, f[k]])), dashboard_company:f.company, dashboard_source_type:f.sourceType, dashboard_evidence_levels:f.ev.map(k => EV[k].label).join('; '),
    dashboard_design_status:f.ev.includes('design') ? DS_LABEL[f.ds] || '' : '', dashboard_outcome_type:f.ev.includes('outcome') ? OT_LABEL[f.ot] || '' : '', dashboard_mechanisms:f.mechs.map(m => MECH[m]?.label).join('; '), dashboard_themes:f.themes.map(t => THEME_BY[t]?.name).join('; '), dashboard_classification:f.auto ? 'auto (keyword rules)' : 'curated'}));
  download(name, toCSV(rows, [...FIELDS, ...extra]));
}
function copyText(t){
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e){} ta.remove(); };
  try { navigator.clipboard.writeText(t).catch(fallback); } catch(e){ fallback(); }
}

document.addEventListener('click', e => {

  else if (act === 'docs'){ closeDrawer(); resetDocF(); Object.assign(docF, f); renderDocsShell(); goSection('documents'); }
  else if (act === 'tl'){ closeDrawer(); resetTlF(); Object.assign(tlF, f); renderTimelineShell(); goSection('timeline'); }
  else if (act === 'doc'){ openDoc(v); }
  else if (act === 'find'){ openFinding(v); }
  else if (act === 'theme'){ closeDrawer(); goSection('themes', 'theme-' + v); }
  else if (act === 'tier'){ goSection('intent', 'tier-' + v); }

  else if (act === 'reset-docs'){ resetDocF(); renderDocsShell(); }

});

$('#loadCsvBtn').onclick = () => $('#csvInput').click();
